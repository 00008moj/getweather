<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetWeather</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist+Pixel&family=Geist:ital,wght@0,100..900;1,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="weather-top-display">
            <h1>GetWeather</h1>
            <form class="weather-form">
                <input type="text" class="city-input" id="cityInput" placeholder="City...">
                <button type="submit" class="get-weather-button" id="getWeather"><i class="iconoir-search"></i></button>
            </form>
            <button class="dark-mode-button" id="darkModeButton" onclick="toggleDarkMode()">theme</button>
        </div>

        <div class="weather-container" style="display: none;">
            <div class="text-info">
                <h1 class="city-display" id="cityDisplay"></h1>
                <p class="temperature-display" id="temperatureDisplay"></p>
                <p class="description-display" id="descriptionDisplay"></p>

                <div class="other-weather-info">
                    <div class="other-info-container">
                        <p class="humidity-display" id="humidityDisplay"></p>
                        <p class="humidity-info" id="humidityInfo"></p>
                    </div>

                    <div class="other-info-container">
                        <p class="wind-display" id="windDisplay"></p>
                        <p class="wind-info" id="windInfo"></p>
                    </div>

                    <div class="other-info-container">
                        <p class="feels-like-display" id="feelsLikeDisplay"></p>
                        <p class="feels-like-info" id="feelsLikeInfo"></p>
                    </div>
                </div>
            </div>
            
            <div class="image">
                <img id="weatherIcon" width="128" height="128" style="display: none;">
            </div>

            <p class="error-display" id="errorDisplay"></p>
        </div>
    </div>
</body>
</html>
